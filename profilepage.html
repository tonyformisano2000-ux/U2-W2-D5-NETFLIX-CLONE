<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-dark">
    <div class="bg-gradient d-block">
      <img
        class="m-3"
        rel="logo"
        src="./assets/assets/netflix_logo.png"
        alt="Netflix Logo"
        style="width: 10rem"
      />
    </div>
    <div class="container mb-5">
      <div class="row d-flex justify-content-center">
        <div class="col-6">
          <h1 class="text-white">Edit Profile</h1>
          <hr />
          <div class="row">
            <div class="col-3">
              <img class="rounded-3 w-100" src="./assets/assets/avatar.png" />
              <i class="bi bi-pencil-fill text-white z"></i>
            </div>
            <div class="col-9 py-2">
              <h3 class="bg-secondary text-white">Strive Student</h3>
              <p class="text-white">Language:</p>
              <button class="dropdown-toggle">English</button>
              <ul class="dropdown-menu">
                <li class="dropdown-item">Spanish</li>
                <li class="dropdown-item">Italian</li>
                <li class="dropdown-item">French</li>
                <li class="dropdown-item">German</li>
              </ul>
              <hr class="text-white" />
            </div>
          </div>
          <div class="row">
            <div class="col-9 offset-3 py-2">
              <h3 class="text-white fw-light">Maturity Settings:</h3>
              <button class="bg-secondary text-white p-1 px-2">
                ALL MATURITY RATIGS
              </button>
              <p class="text-white">
                Show titles of<span class="fw-bold"> all maturity ratings</span>
                for this profile.
              </p>
              <button class="border border-secondary bg-dark text-secondary">
                EDIT
              </button>
            </div>
          </div>

          <div class="row">
            <div class="col-9 offset-3 py-2">
              <hr class="text-white" />
              <h3 class="text-white">Autoplay controls</h3>
              <div>
                <input id="cb1" type="checkbox" /><label
                  for="cb1"
                  class="text-white"
                  >Autoplay next episod in a series on all devices.</label
                >
              </div>
              <div>
                <input id="cb2" type="checkbox" /><label
                  for="cb2"
                  class="text-white"
                  >Autoplay previews while browsing on all devices.</label
                >
              </div>
            </div>
          </div>
          <hr class="text-white" />
          <div class="row d-flex justify-content-between">
            <button
              class="border border-secondary bg-dark text-secondary col-2 p-2"
            >
              SAVE
            </button>
            <button
              class="border border-secondary bg-dark text-secondary col-4 p-2"
            >
              CANCEL
            </button>
            <button
              class="border border-secondary bg-dark text-secondary col-5 p-2"
            >
              DELETE PROFILE
            </button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
